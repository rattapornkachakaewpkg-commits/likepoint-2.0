<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 LikePoint 2.0 — Task Dashboard (Full Detail)</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --border: #334155;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --green: #22c55e;
  --orange: #f97316;
  --yellow: #eab308;
  --blue: #3b82f6;
  --red: #ef4444;
  --purple: #a855f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding: 1rem;
  min-height: 100vh;
}
.container { max-width: 1400px; margin: 0 auto; }
header {
  text-align: center;
  padding: 1.5rem 1rem;
  background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
  border-radius: 12px;
  margin-bottom: 1.5rem;
  border: 1px solid var(--border);
}
h1 { font-size: clamp(1.4rem, 4vw, 2.2rem); margin-bottom: 0.5rem; }
.subtitle { color: var(--muted); font-size: 0.95rem; }

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem;
  text-align: center;
}
.stat-num { font-size: 1.8rem; font-weight: bold; }
.stat-label { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
.stat.p0 .stat-num { color: var(--red); }
.stat.p1 .stat-num { color: var(--orange); }
.stat.p2 .stat-num { color: var(--yellow); }
.stat.done .stat-num { color: var(--green); }

/* Filters */
.filters {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem;
  margin-bottom: 1.5rem;
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  align-items: center;
}
.filter-group { display: flex; align-items: center; gap: 0.5rem; }
.filter-group label { color: var(--muted); font-size: 0.9rem; }
select, input[type=search] {
  background: #0f172a;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.4rem 0.75rem;
  border-radius: 6px;
  font-size: 0.9rem;
  font-family: inherit;
}

/* Timeline / Sprint bars */
.sprint-bar {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem;
  margin-bottom: 1.5rem;
}
.sprint-bar h3 { font-size: 1rem; margin-bottom: 0.75rem; color: var(--muted); }
.sprints {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 0.5rem;
}
.sprint {
  background: #0f172a;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.5rem;
  font-size: 0.8rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.sprint:hover { transform: translateY(-2px); border-color: var(--green); }
.sprint.active { background: var(--green); color: #000; font-weight: bold; }
.sprint-name { font-weight: bold; }
.sprint-tasks { color: var(--muted); font-size: 0.75rem; margin-top: 0.15rem; }
.sprint.active .sprint-tasks { color: #000; }

/* Task grid */
.task-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.task-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.task-card:hover {
  border-color: var(--green);
  transform: translateY(-3px);
  box-shadow: 0 4px 12px rgba(34, 197, 94, 0.15);
}
.task-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.5rem;
}
.task-num {
  background: var(--blue);
  color: white;
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 0.85rem;
  flex-shrink: 0;
}
.priority {
  font-size: 0.75rem;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  font-weight: bold;
}
.priority.P0 { background: var(--red); color: white; }
.priority.P1 { background: var(--orange); color: white; }
.priority.P2 { background: var(--yellow); color: #000; }
.task-name {
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.3;
  flex: 1;
}
.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  font-size: 0.8rem;
  color: var(--muted);
}
.task-meta span {
  background: #0f172a;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
}
.task-desc {
  color: var(--muted);
  font-size: 0.85rem;
  line-height: 1.4;
}
.progress-bar {
  background: #0f172a;
  height: 6px;
  border-radius: 3px;
  overflow: hidden;
  margin-top: auto;
}
.progress-fill {
  background: linear-gradient(90deg, var(--green) 0%, #16a34a 100%);
  height: 100%;
  transition: width 0.5s;
}
.progress-text {
  font-size: 0.75rem;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  margin-top: 0.25rem;
}

/* Modal */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 1rem;
}
.modal-bg.active { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 700px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 1.5rem;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1rem;
  gap: 1rem;
}
.modal-close {
  background: var(--red);
  color: white;
  border: none;
  width: 32px; height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  flex-shrink: 0;
}
.modal-section {
  margin-bottom: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.modal-section:last-child { border-bottom: none; }
.modal-section h4 {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.modal-section p { font-size: 0.95rem; }
.modal-section ul {
  list-style: none;
  padding-left: 0;
}
.modal-section ul li {
  padding: 0.4rem 0;
  padding-left: 1.5rem;
  position: relative;
  font-size: 0.9rem;
}
.modal-section ul li::before {
  content: "✓";
  position: absolute;
  left: 0;
  color: var(--green);
  font-weight: bold;
}
.tech-stack {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}
.tech-stack span {
  background: #0f172a;
  border: 1px solid var(--border);
  padding: 0.25rem 0.6rem;
  border-radius: 4px;
  font-size: 0.8rem;
  color: var(--blue);
}

.empty { text-align: center; padding: 3rem; color: var(--muted); }

footer {
  text-align: center;
  padding: 2rem 1rem;
  color: var(--muted);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
  margin-top: 2rem;
}

@media (max-width: 600px) {
  .task-grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .sprints { grid-template-columns: repeat(3, 1fr); }
}
</style>
<script src="https://twemoji.maxcdn.com/v/latest/twemoji.min.js" crossorigin="anonymous"></script>
<script>
// Twemoji loader - wait for everything to render
function applyTwemoji() {
  if (typeof twemoji !== 'undefined' && document.body) {
    twemoji.parse(document.body, { folder: 'svg', ext: '.svg' });
  } else {
    setTimeout(applyTwemoji, 200);
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', applyTwemoji);
} else {
  applyTwemoji();
}
// Also re-apply after dynamic content render
setTimeout(applyTwemoji, 500);
setTimeout(applyTwemoji, 1500);
</script>
<style>
/* Twemoji SVG size */
img.emoji {
  height: 1em;
  width: 1em;
  margin: 0 .05em 0 .1em;
  vertical-align: -0.1em;
  display: inline-block;
}
</style>

function renderStats() {
  const p0 = TASKS.filter(t => t.priority === 'P0').length;
  const p1 = TASKS.filter(t => t.priority === 'P1').length;
  const p2 = TASKS.filter(t => t.priority === 'P2').length;
  const totalDays = TASKS.reduce((s, t) => s + t.manDay, 0);
  const done = TASKS.filter(t => t.status === 'Done').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat p0"><div class="stat-num">${p0}</div><div class="stat-label">🔴 P0 MUST</div></div>
    <div class="stat p1"><div class="stat-num">${p1}</div><div class="stat-label">🟠 P1 SHOULD</div></div>
    <div class="stat p2"><div class="stat-num">${p2}</div><div class="stat-label">🟡 P2 COULD</div></div>
    <div class="stat done"><div class="stat-num">${done}</div><div class="stat-label">✅ Done</div></div>
    <div class="stat"><div class="stat-num">${TASKS.length}</div><div class="stat-label">📋 Tasks ทั้งหมด</div></div>
    <div class="stat"><div class="stat-num">${totalDays}</div><div class="stat-label">⏱️ Man-days</div></div>
  `;
}

function renderSprints() {
  const sprintMap = {};
  TASKS.forEach(t => {
    if (!sprintMap[t.sprint]) sprintMap[t.sprint] = [];
    sprintMap[t.sprint].push(t);
  });
  const sortedKeys = Object.keys(sprintMap).sort((a, b) => {
    const na = parseInt(a.replace('S', '')), nb = parseInt(b.replace('S', ''));
    return na - nb;
  });
  document.getElementById('sprints').innerHTML = sortedKeys.map(k => `
    <div class="sprint" data-sprint="${k}" onclick="filterSprint('${k}')">
      <div class="sprint-name">${k}</div>
      <div class="sprint-tasks">${sprintMap[k].length} tasks</div>
    </div>
  `).join('');
}

let activeSprintFilter = null;
function filterSprint(s) {
  activeSprintFilter = activeSprintFilter === s ? null : s;
  document.querySelectorAll('.sprint').forEach(el => el.classList.remove('active'));
  if (activeSprintFilter) {
    document.querySelector(`.sprint[data-sprint="${activeSprintFilter}"]`).classList.add('active');
  }
  renderTasks();
}

function renderTasks() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const prio = document.getElementById('priorityFilter').value;
  const so = document.getElementById('soFilter').value;
  const status = document.getElementById('statusFilter').value;
  
  const filtered = TASKS.filter(t => {
    if (search && !(`${t.taskName} ${t.so} ${t.owner}`.toLowerCase().includes(search))) return false;
    if (prio && t.priority !== prio) return false;
    if (so && t.so !== so) return false;
    if (status && t.status !== status) return false;
    if (activeSprintFilter && t.sprint !== activeSprintFilter) return false;
    return true;
  });
  
  if (filtered.length === 0) {
    document.getElementById('taskGrid').innerHTML = '<div class="empty">ไม่พบ Task ที่ตรงกับ filter</div>';
    return;
  }
  
  document.getElementById('taskGrid').innerHTML = filtered.map(t => `
    <div class="task-card" onclick="openModal(${t.taskId})">
      <div class="task-head">
        <div class="task-num">${t.taskId}</div>
        <span class="priority ${t.priority}">${t.priority}</span>
        <div class="task-name">${t.taskName}</div>
      </div>
      <div class="task-meta">
        <span>📅 ${t.sprint}</span>
        <span>⏱️ ${t.manDay}d</span>
        <span>🎯 ${t.so}</span>
        <span>👤 ${t.owner}</span>
        <span>${t.status === 'Done' ? '✅' : t.status === 'In Progress' ? '🚀' : '📋'} ${t.status}</span>
      </div>
      <div class="task-desc">${t.description}</div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${t.status === 'Done' ? 100 : t.status === 'In Progress' ? 50 : 0}%"></div>
      </div>
      <div class="progress-text">
        <span>${t.startDate} → ${t.endDate}</span>
        <span>${t.status === 'Done' ? '100%' : t.status === 'In Progress' ? '50%' : '0%'}</span>
      </div>
    </div>
  `).join('');
}

function openModal(id) {
  const t = TASKS.find(x => x.taskId === id);
  if (!t) return;
  document.getElementById('modalTitle').textContent = `#${t.taskId} — ${t.taskName}`;
  document.getElementById('modalSubtitle').innerHTML = `
    <span class="priority ${t.priority}">${t.priority}</span>
    ${t.sprint} • ${t.manDay} วัน • ${t.startDate} → ${t.endDate} • ${t.so} • ${t.owner}
  `;
  
  const acList = t.acceptance.map(a => `<li>${a}</li>`).join('');
  const techList = t.techStack.split(/[,
]/).map(s => s.trim()).filter(Boolean).map(s => `<span>${s}</span>`).join('');
  
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-section">
      <h4>📝 Description</h4>
      <p>${t.description}</p>
    </div>
    <div class="modal-section">
      <h4>🎨 Design Thinking</h4>
      <p><strong>💜 Empathize:</strong> ${t.empathize}</p>
      <p style="margin-top:0.5rem"><strong>🎯 Define:</strong> ${t.define}</p>
      <p style="margin-top:0.5rem"><strong>💡 Ideate:</strong> ${t.ideate}</p>
      <p style="margin-top:0.5rem"><strong>🛠️ Prototype:</strong> ${t.prototype}</p>
      <p style="margin-top:0.5rem"><strong>🧪 Test:</strong> ${t.test}</p>
      <p style="margin-top:0.5rem"><strong>🏆 Outcome:</strong> ${t.outcome}</p>
    </div>
    <div class="modal-section">
      <h4>✅ Acceptance Criteria (${t.acceptance.length} ข้อ)</h4>
      <ul>${acList}</ul>
    </div>
    <div class="modal-section">
      <h4>📦 Deliverable</h4>
      <p>${t.deliverable}</p>
    </div>
    <div class="modal-section">
      <h4>💻 Tech Stack</h4>
      <div class="tech-stack">${techList}</div>
    </div>
  `;
  document.getElementById('modalBg').classList.add('active');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('active');
}

document.getElementById('searchInput').addEventListener('input', renderTasks);
document.getElementById('priorityFilter').addEventListener('change', renderTasks);
document.getElementById('soFilter').addEventListener('change', renderTasks);
document.getElementById('statusFilter').addEventListener('change', renderTasks);

renderStats();
renderSprints();
renderTasks();
</script>
