<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Gift Card Console — PF-11</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px; }
  .stat .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
  .stat .value { font-size: 24px; font-weight: 700; margin-top: 6px; color: #f1f5f9; }
  .stat.success .value { color: #22c55e; }
  .stat.warning .value { color: #f59e0b; }
  .stat.info .value { color: #3b82f6; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row label { width: 130px; font-size: 12px; color: #94a3b8; }
  input, select, button { background: #0f172a; color: #e2e8f0; border: 1px solid #334155; padding: 6px 10px; border-radius: 5px; font-size: 13px; }
  button { cursor: pointer; font-weight: 600; }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: white; }
  button.success { background: #22c55e; border-color: #22c55e; color: white; }
  button.danger { background: #ef4444; border-color: #ef4444; color: white; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-size: 10px; text-transform: uppercase; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .badge.active { background: #16a34a; color: white; }
  .badge.redeemed { background: #a855f7; color: white; }
  .badge.voided { background: #475569; color: white; }
  .log { background: #020617; border-radius: 6px; padding: 10px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 11px; }
  .log .ts { color: #64748b; }
  .log .ok { color: #22c55e; }
  .log .err { color: #ef4444; }
  .log .info { color: #60a5fa; }
  .empty { padding: 16px; text-align: center; color: #64748b; font-size: 12px; }
  .card-display { background: linear-gradient(135deg, #3b82f6, #a855f7); border-radius: 12px; padding: 20px; margin: 16px 0; }
  .card-display .code { font-family: 'Monaco', monospace; font-size: 22px; font-weight: 800; letter-spacing: 4px; color: white; text-align: center; margin: 12px 0; }
  .card-display .pin { font-family: 'Monaco', monospace; font-size: 16px; color: #fef3c7; text-align: center; }
  .card-display .amount { font-size: 32px; font-weight: 800; color: white; text-align: center; }
  .card-display .merchant { font-size: 14px; color: #cbd5e1; text-align: center; }
  .copy-hint { color: #fbbf24; font-size: 11px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<h1>🎁 Gift Card Console</h1>
<p class="subtitle">PF-11 (Phase E) — Permanent gift cards: code + PIN, no expiry · 24/24 tests passing</p>

<div class="stats">
  <div class="stat info">
    <div class="label">Total Cards</div>
    <div class="value" id="stat-total">0</div>
  </div>
  <div class="stat success">
    <div class="label">Active</div>
    <div class="value" id="stat-active">0</div>
  </div>
  <div class="stat">
    <div class="label">Redeemed</div>
    <div class="value" id="stat-redeemed">0</div>
  </div>
  <div class="stat warning">
    <div class="label">Volume (THB)</div>
    <div class="value" id="stat-volume">0</div>
  </div>
  <div class="stat success">
    <div class="label">Revenue (Fee)</div>
    <div class="value" id="stat-revenue">0</div>
  </div>
</div>

<div class="grid">
  <!-- Create -->
  <div class="card">
    <h2>① Create Gift Card</h2>
    <div class="row">
      <label>Issuer ID</label>
      <input id="issue-by" value="M-1" style="flex: 1;">
    </div>
    <div class="row">
      <label>Merchant</label>
      <select id="issue-merchant" style="flex: 1;">
        <option value="MCH-1">Bangkok Cafe</option>
        <option value="MCH-2">PKG Mart</option>
      </select>
    </div>
    <div class="row">
      <label>Amount (THB)</label>
      <input id="issue-amount" type="number" value="500" style="flex: 1;">
    </div>
    <div class="row">
      <label>Recipient</label>
      <input id="issue-recipient" placeholder="(optional) M-2 or phone" style="flex: 1;">
    </div>
    <div class="row">
      <label>Message</label>
      <input id="issue-message" placeholder="(optional) Happy birthday!" style="flex: 1;">
    </div>
    <button class="primary" onclick="createCard()">+ Issue Card</button>
    <div id="card-display-container"></div>
    <div class="log" id="issue-log" style="margin-top: 12px;"></div>
  </div>

  <!-- Redeem -->
  <div class="card">
    <h2>② Redeem Card</h2>
    <div class="row">
      <label>Code</label>
      <input id="redeem-code" placeholder="XXXX-XXXX-XXXX-XXXX" style="flex: 1; text-transform: uppercase;">
    </div>
    <div class="row">
      <label>PIN</label>
      <input id="redeem-pin" placeholder="6 digits" maxlength="6" style="flex: 1;">
    </div>
    <div class="row">
      <label>Member ID</label>
      <input id="redeem-member" value="M-2" style="flex: 1;">
    </div>
    <button class="success" onclick="redeemCard()">💰 Redeem</button>
    <div class="log" id="redeem-log" style="margin-top: 12px;"></div>
  </div>
</div>

<!-- List -->
<div class="card">
  <h2>③ All Gift Cards</h2>
  <div class="toolbar" style="margin-bottom: 12px;">
    <select id="filter-status" onchange="renderCards()">
      <option value="all">All</option>
      <option value="active">Active</option>
      <option value="redeemed">Redeemed</option>
      <option value="voided">Voided</option>
    </select>
    <button onclick="renderCards()">🔄 Refresh</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Code</th>
        <th>Issuer</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Issued</th>
        <th>Redeemed By</th>
        <th>Message</th>
      </tr>
    </thead>
    <tbody id="cards-tbody">
      <tr><td colspan="7" class="empty">No cards yet</td></tr>
    </tbody>
  </table>
</div>

<script>
const mockStore = {
  _cards: new Map(),
  _idSeq: 0,
  _merchants: { 'MCH-1': { merchant_id: 'MCH-1', status: 'active', name: 'Bangkok Cafe' }, 'MCH-2': { merchant_id: 'MCH-2', status: 'active', name: 'PKG Mart' } },
};

function newId(prefix) { return `${prefix}-${Date.now()}-${++mockStore._idSeq}`; }
function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 16; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return `${code.slice(0,4)}-${code.slice(4,8)}-${code.slice(8,12)}-${code.slice(12,16)}`;
}
function genPin() { return String(Math.floor(Math.random() * 1000000)).padStart(6, '0'); }

function logTo(elemId, msg, type = 'info') {
  const el = document.getElementById(elemId);
  const ts = new Date().toLocaleTimeString('th-TH');
  const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'info';
  el.innerHTML += `<div><span class="ts">[${ts}]</span> <span class="${cls}">${msg}</span></div>`;
  el.scrollTop = el.scrollHeight;
}

function createCard() {
  const issuer = document.getElementById('issue-by').value.trim();
  const merchant = document.getElementById('issue-merchant').value;
  const amount = parseFloat(document.getElementById('issue-amount').value);
  const recipient = document.getElementById('issue-recipient').value.trim();
  const message = document.getElementById('issue-message').value.trim();
  if (!issuer || !amount || amount <= 0) { logTo('issue-log', '❌ Invalid input', 'err'); return; }

  const card_id = newId('GC');
  const code = genCode();
  const pin = genPin();
  const fee = amount * 0.01;
  const card = {
    card_id, code, pin,
    merchant_id: merchant,
    amount, fee, balance: amount,
    issued_by: issuer, recipient_member_id: recipient || null,
    recipient_phone: null, message, design: 'standard',
    status: 'active', issued_at: new Date().toISOString(),
    expires_at: null,
    redeemed_at: null, redeemed_by: null,
  };
  mockStore._cards.set(card_id, card);

  // Show card display
  document.getElementById('card-display-container').innerHTML = `
    <div class="card-display">
      <div class="merchant">${mockStore._merchants[merchant].name}</div>
      <div class="amount">฿${amount.toLocaleString()}</div>
      <div class="code">${code}</div>
      <div class="pin">PIN: ${pin}</div>
      <div class="copy-hint">⚠️ Save code + PIN now — shown only once!</div>
    </div>
  `;
  logTo('issue-log', `✅ Card issued: ${code}`, 'ok');
  logTo('issue-log', `   Amount: ฿${amount} + fee ฿${fee} = total ฿${amount + fee}`, 'info');
  logTo('issue-log', `   Issued by: ${issuer}`, 'info');
  if (recipient) logTo('issue-log', `   Recipient: ${recipient}`, 'info');
  if (message) logTo('issue-log', `   Message: "${message}"`, 'info');
  renderCards();
  updateStats();
}

function redeemCard() {
  const code = document.getElementById('redeem-code').value.trim().toUpperCase();
  const pin = document.getElementById('redeem-pin').value.trim();
  const member = document.getElementById('redeem-member').value.trim();
  if (!code || !pin || !member) { logTo('redeem-log', '❌ Code + PIN + Member required', 'err'); return; }

  const card = Array.from(mockStore._cards.values()).find((c) => c.code === code);
  if (!card) { logTo('redeem-log', '❌ Invalid code', 'err'); return; }
  if (card.status === 'redeemed') { logTo('redeem-log', '❌ Already redeemed', 'err'); return; }
  if (card.pin !== pin) { logTo('redeem-log', '❌ Wrong PIN', 'err'); return; }

  card.status = 'redeemed';
  card.redeemed_by = member;
  card.redeemed_at = new Date().toISOString();
  card.balance = 0;

  logTo('redeem-log', `✅ Redeemed: ฿${card.amount} → ${member}`, 'ok');
  logTo('redeem-log', `   From: ${mockStore._merchants[card.merchant_id].name}`, 'info');
  if (card.message) logTo('redeem-log', `   Message: "${card.message}"`, 'info');
  renderCards();
  updateStats();
}

function renderCards() {
  const tbody = document.getElementById('cards-tbody');
  const filter = document.getElementById('filter-status').value;
  let cards = Array.from(mockStore._cards.values());
  if (filter !== 'all') cards = cards.filter((c) => c.status === filter);
  cards.sort((a, b) => b.issued_at.localeCompare(a.issued_at));
  if (cards.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="empty">No cards yet</td></tr>'; return; }
  tbody.innerHTML = cards.map((c) => `
    <tr>
      <td><code>${c.code}</code></td>
      <td>${c.issued_by}</td>
      <td><strong>฿${c.amount.toLocaleString()}</strong></td>
      <td><span class="badge ${c.status}">${c.status}</span></td>
      <td>${new Date(c.issued_at).toLocaleString('th-TH')}</td>
      <td>${c.redeemed_by || '—'}</td>
      <td>${c.message || '—'}</td>
    </tr>
  `).join('');
}

function updateStats() {
  const cards = Array.from(mockStore._cards.values());
  document.getElementById('stat-total').textContent = cards.length;
  document.getElementById('stat-active').textContent = cards.filter((c) => c.status === 'active').length;
  document.getElementById('stat-redeemed').textContent = cards.filter((c) => c.status === 'redeemed').length;
  document.getElementById('stat-volume').textContent = cards.reduce((s, c) => s + c.amount, 0).toLocaleString();
  document.getElementById('stat-revenue').textContent = cards.reduce((s, c) => s + c.fee, 0).toLocaleString();
}

renderCards();
updateStats();
</script>

</body>
</html>
